name: descubrir-endpoint-submissions

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install requests

      - name: Probar endpoints de submissions con la API key del profesor
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python scripts/discover_submit_api.py && python scripts/discover_submit_schema.py

