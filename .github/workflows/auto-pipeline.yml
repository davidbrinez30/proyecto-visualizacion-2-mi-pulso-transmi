name: pipeline-automatico

on:
  workflow_dispatch:
  schedule:
    # El profesor sube datos nuevos cada hora, pero la ventana para enviar
    # la prediccion de cada ciclo solo esta abierta ~25 minutos. Corremos
    # cada 10 minutos para no perdernos ninguna ventana.
    - cron: "*/10 * * * *"

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Traer datos nuevos del reto
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
        run: python scripts/fetch_data.py

      - name: Sincronizar observations/context nuevos a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sync_supabase.py

      - name: Entrenar (siempre reentrena con los datos mas recientes)
        run: python -m src.train

      - name: Predecir (4 horizontes)
        run: python -m src.predict

      - name: Monitorear (drift, decision de reentrenamiento, persistencia en Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.monitor

      - name: Commit data y artifacts actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data artifacts
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "pipeline automatico: nueva corrida (data + artifacts)"
            git push
          fi

      - name: Enviar prediccion real al reto si el ciclo esta abierto (POST /v1/submissions)
        continue-on-error: true
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: PYTHONPATH=. python scripts/submit_first_prediction.py

      - name: Evaluar desempeno real contra lo que ya publico el profesor
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/eval_performance.py
