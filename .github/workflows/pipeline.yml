name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  # Activa el schedule unicamente cuando el profesor publique la frecuencia.
  # schedule:
  #   - cron: "7 * * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch latest data
        env:
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
        run: python scripts/fetch_data.py

      - name: Train (baselines + modelo, validacion temporal)
        run: python -m src.train

      - name: Predict (4 horizontes)
        run: python -m src.predict

      - name: Monitor (drift, reentrenamiento, persistencia en Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.monitor

      - name: Commit data y artifacts actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data artifacts
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "pipeline: nueva corrida (data + artifacts)"
            git push
          fi
